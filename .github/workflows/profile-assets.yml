name: Update Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Generate Snake
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: RadhikaKapoor383
          outputs: |
            snake.svg
            snake-dark.svg?palette=github-dark

      # Generate Trophy
      - name: Generate Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=RadhikaKapoor383&theme=tokyonight&column=7&margin-w=10&margin-h=10'
          path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Commit generated files
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add snake.svg snake-dark.svg trophy.svg

          git diff --cached --quiet || git commit -m "Update profile assets"

          git push
