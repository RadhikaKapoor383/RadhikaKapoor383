name: Update Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Generate Contribution Snake
      # -------------------------
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: RadhikaKapoor383
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # -------------------------
      # Generate GitHub Trophy
      # -------------------------
      - name: Generate Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=RadhikaKapoor383&theme=tokyonight&column=7&margin-w=10&margin-h=10'
          path: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # Publish generated files
      # -------------------------
      - name: Publish assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
